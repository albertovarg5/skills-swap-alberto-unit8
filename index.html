

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Swap</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Skill Swap</h1>
    <nav>
      <a href="#skills">Available Skills</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>Share Your Skills. Learn Something New.</h2>
      <p>Connect with students and exchange skills.</p>
    </section>

    <section id="skills">
      <h2>Available Skills</h2>
      <p>Choose a category to find skills.</p>

      <div class="filters">
        <button class="filter-btn active" data-category="All">All</button>
        <button class="filter-btn" data-category="Programming">Programming</button>
        <button class="filter-btn" data-category="Music">Music</button>
        <button class="filter-btn" data-category="Career">Career</button>
      </div>

      <div id="skills-container" class="skills-grid"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Skill Swap</p>
  </footer>

  <script src="skillswap-functions.js"></script>
  <script src="script.js"></script>
</body>
</html>
